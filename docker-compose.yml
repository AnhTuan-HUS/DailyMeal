services:
  # Database Service (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: dailymeal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dailymeal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dailymeal_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-dailymeal_db}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/seeds/seed_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dailymeal_user} -d ${POSTGRES_DB:-dailymeal_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dailymeal-net

  # Redis Service (Cache & Token Blacklist)
  redis:
    image: redis:7-alpine
    container_name: dailymeal-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-Tuan1209@@}
    ports:
      - "${REDIS_PORT:-16379}:6379"

    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Tuan1209@@}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dailymeal-net

  # Redis Insight (Giao diện Web GUI quản lý Redis)
  redis-insight:
    image: redis/redisinsight:latest
    container_name: dailymeal-redis-insight
    restart: unless-stopped
    ports:
      - "${REDIS_INSIGHT_PORT:-15540}:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dailymeal-net

  # Backend Service (FastAPI)


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dailymeal-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-dailymeal_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dailymeal_secret_password}
      - POSTGRES_DB=${POSTGRES_DB:-dailymeal_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-Tuan1209@@}
      - REDIS_DB=${REDIS_DB:-0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-super_secret_development_key}
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dailymeal-net

  # Frontend Service (React / Vite + Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dailymeal-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-13000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dailymeal-net

networks:
  dailymeal-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  redisinsight_data:
    driver: local


